name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Report tested commit and runtime
        run: |
          git rev-parse HEAD
          python --version
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run package tests
        run: |
          python -m pytest -p no:xonsh -q \
            tests/test_dialog_index.py \
            tests/test_dlogs.py \
            tests/test_harness_stores.py \
            tests/test_worktree_dialogs.py \
            tests/test_resume.py \
            tests/test_resume_completion.py \
            tests/test_dialog_timestamps.py \
            tests/test_git_discovery.py \
            tests/test_aiskillz_layers.py

  deployment:
    name: Deployment and commit-plan / Python 3.15
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Report tested commit and runtime
        run: |
          git rev-parse HEAD
          python --version
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Install terminal pager
        run: |
          sudo apt-get update
          sudo apt-get install --yes less
      - name: Validate skills
        run: bash scripts/validate-skills.sh
      - name: Run deployment and embedded workflow tests
        run: bash tests/deploy/test-deploy.sh
      - name: Test workflow-state migration
        run: python -B tests/deploy/test-workflow-state.py
      - name: Test benchmark capture
        run: python -m unittest tests.test_benchmark_capture
