[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiskillz"
version = "0.1.0"
description = "Local session discovery for coding harnesses"
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "xonsh"]

[project.scripts]
"ai.dlogs" = "aiskillz.cli:main"
"ai.resume" = "aiskillz.cli:resume_main"

[project.entry-points."xonsh.xontribs"]
aiskillz = "xontrib.aiskillz"

[tool.setuptools]
license-files = ["LICENSE", "LICENSING.md"]

[tool.setuptools.packages.find]
include = ["aiskillz*", "xontrib*"]
namespaces = true
